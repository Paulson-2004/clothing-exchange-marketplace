<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Listing images are served from these CDNs. Opening the connections -->
    <!-- while the app bundle loads saves a DNS + TLS round-trip on the first -->
    <!-- listing card image. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- ANTI-FLASH THEME SCRIPT -->
    <!-- This runs synchronously BEFORE React loads. It checks localStorage and -->
    <!-- applies the 'data-theme' attribute to the HTML tag immediately. -->
    <!-- Without this, a user who prefers light mode would see a brief flash of -->
    <!-- the default dark theme while waiting for the React JavaScript bundle to load. -->
    <!-- MUST stay in sync with the logic in ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>ReWear — Clothing Exchange Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
